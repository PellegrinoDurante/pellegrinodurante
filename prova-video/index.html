<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova video</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  video { display: block; width: 100%; max-height: 70svh; object-fit: cover; }
  p { padding: 0 16px; }
</style>
</head>
<body>
  <video autoplay muted loop playsinline>
    <source src="flower.webm" type="video/webm">
    <source src="flower.mp4" type="video/mp4">
  </video>
  <p>Loop autoplay (come la hero). Sotto: lo stesso MP4 con controlli, per provare i salti nel video.</p>
  <video controls playsinline src="flower.mp4"></video>
</body>
</html>
